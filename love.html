<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For My Love ❤️</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      overflow-x: hidden;
      background: linear-gradient(135deg, #180016, #57002d, #16001f);
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }

    .heart-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: heartbeat 1.2s infinite;
      margin-bottom: 25px;
    }

    .heart {
      color: #ff174f;
      font-size: clamp(130px, 35vw, 220px);
      line-height: 1.2;
      text-shadow:
        0 0 15px #ff174f,
        0 0 35px #ff174f,
        0 0 65px #ff006a;
    }

    .name {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      color: white;
      font-size: clamp(24px, 7vw, 38px);
      font-weight: bold;
      text-shadow: 0 0 10px #ff8bb3, 0 0 20px #ff174f;
      white-space: nowrap;
    }

    h1 {
      color: #ffb5d0;
      font-size: clamp(24px, 6vw, 38px);
      margin-bottom: 12px;
      text-shadow: 0 0 15px #ff174f;
    }

    p {
      font-size: 18px;
      margin-bottom: 25px;
    }

    button {
      background: #ff174f;
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: 30px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 20px #ff174f;
      transition: 0.3s;
      margin-bottom: 20px;
    }

    button:hover {
      transform: scale(1.05);
      background: #ff4081;
    }

    #music-player {
      display: none;
      width: min(100%, 400px);
      margin-top: 10px;
    }

    #music-player iframe {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      border: none;
      border-radius: 12px;
    }

    .floating-heart {
      position: fixed;
      bottom: -40px;
      color: #ff4f87;
      font-size: 22px;
      pointer-events: none;
      animation: floatUp linear forwards;
      z-index: -1;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    @keyframes floatUp {
      from {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }
      to {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
      }
    }
  </style>

</head>

<body>

  <div class="heart-container">
    <div class="heart">❤️</div>
    <div class="name">Kanoza</div>
  </div>

  <h1>I LOVE YOU ❤️</h1>
  <p>You are my favorite person in the world 💖</p>

  <button id="music-button" onclick="playSong()">
    Play Our Song 🎵❤️
  </button>

  <div id="music-player">
    <iframe
      id="youtube-player"
      title="Our Song"
      src=""
      allow="autoplay; encrypted-media; picture-in-picture"
      allowfullscreen>
    </iframe>
  </div>

  <script>
    function playSong() {
      const player = document.getElementById("music-player");
      const iframe = document.getElementById("youtube-player");
      const button = document.getElementById("music-button");

      player.style.display = "block";

      iframe.src =
        "https://www.youtube.com/embed/naUqWQ-of6o?autoplay=1&playsinline=1";

      button.textContent = "Our Song Is Ready ❤️🎵";
    }

    // Floating hearts
    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "floating-heart";
      heart.textContent = Math.random() > 0.5 ? "❤️" : "💕";

      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = (15 + Math.random() * 25) + "px";
      heart.style.animationDuration = (4 + Math.random() * 5) + "s";

      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 9000);
    }

    setInterval(createHeart, 500);
  </script>

</body>
</html>
