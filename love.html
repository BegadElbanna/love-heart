<!DOCTYPE html>

<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For My Kanoza ❤️</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      text-align: center;
      font-family: Arial, sans-serif;
      color: white;
      padding: 25px 15px;
      background: radial-gradient(circle at top, #65002f, #250018 55%, #08000d);
    }

    .container {
      width: 100%;
      max-width: 450px;
      position: relative;
      z-index: 2;
    }

    .heart-box {
      position: relative;
      display: inline-block;
      animation: heartbeat 1.2s infinite;
      margin: 15px 0 25px;
    }

    .heart {
      font-size: clamp(150px, 42vw, 220px);
      line-height: 1.2;
      filter: drop-shadow(0 0 15px #ff174f)
              drop-shadow(0 0 35px #ff174f);
    }

    .name {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: clamp(26px, 7vw, 38px);
      font-weight: bold;
      white-space: nowrap;
      text-shadow: 0 0 10px #fff, 0 0 25px #ff174f;
    }

    h1 {
      font-size: clamp(27px, 7vw, 38px);
      color: #ffb3cf;
      text-shadow: 0 0 15px #ff174f;
      margin-bottom: 12px;
    }

    .message {
      color: #ffe1ec;
      font-size: 16px;
      line-height: 1.8;
      margin-bottom: 25px;
    }

    .music-card {
      width: 100%;
      padding: 20px;
      border: 1px solid rgba(255, 150, 190, 0.35);
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      box-shadow: 0 0 25px rgba(255, 23, 79, 0.15);
    }

    .music-icon {
      font-size: 35px;
      margin-bottom: 10px;
    }

    .music-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .music-subtitle {
      font-size: 13px;
      color: #ffc3d8;
      margin-bottom: 18px;
    }

    .music-button {
      border: none;
      border-radius: 30px;
      padding: 13px 25px;
      color: white;
      background: linear-gradient(135deg, #ff174f, #ff4f91);
      box-shadow: 0 0 20px rgba(255, 23, 79, 0.4);
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .music-button:active {
      transform: scale(0.96);
    }

    .status {
      font-size: 12px;
      color: #ffd6e5;
      margin-top: 13px;
      min-height: 18px;
    }

    .floating-heart {
      position: fixed;
      bottom: -40px;
      pointer-events: none;
      z-index: 1;
      animation: floatUp linear forwards;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.07); }
    }

    @keyframes floatUp {
      from {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }
      to {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
      }
    }
  </style>

</head>

<body>

  <main class="container">

```
<div class="heart-box">
  <div class="heart">❤️</div>
  <div class="name">Kanoza</div>
</div>

<h1>I LOVE YOU ❤️</h1>

<p class="message">
  You are my favorite person in the world. 💖<br>
  Every beat of my heart is for you.
</p>

<section class="music-card">
  <div class="music-icon">🎵💗</div>
  <div class="music-title">Our Special Song</div>
  <div class="music-subtitle">A little song, just for you ❤️</div>

  <button
    type="button"
    class="music-button"
    id="musicButton"
    onclick="toggleMusic()">
    ▶ Play Our Song
  </button>

  <p class="status" id="musicStatus">
    Made with love ❤️
  </p>
</section>

<audio id="ourSong" preload="auto" loop>
  <source src="./song.mp3" type="audio/mpeg">
  Your browser does not support audio.
</audio>
```

  </main>

  <script>
    const song = document.getElementById("ourSong");
    const button = document.getElementById("musicButton");
    const statusText = document.getElementById("musicStatus");

    async function toggleMusic() {
      if (song.paused) {
        statusText.textContent = "Loading your song... 🎵";

        try {
          await song.play();

          button.textContent = "❚❚ Pause Song";
          statusText.textContent = "Playing our song with love ❤️";
        } catch (error) {
          button.textContent = "▶ Try Again";
          statusText.textContent =
            "Couldn't play the song. Check the MP3 file name.";
        }
      } else {
        song.pause();
        button.textContent = "▶ Play Our Song";
        statusText.textContent = "Paused ❤️";
      }
    }

    song.addEventListener("ended", () => {
      button.textContent = "▶ Play Our Song";
      statusText.textContent = "Song finished ❤️";
    });

    song.addEventListener("error", () => {
      statusText.textContent =
        "Audio file not found. Check the file name on GitHub.";
    });

    function createFloatingHeart() {
      const heart = document.createElement("div");
      heart.className = "floating-heart";
      heart.textContent = Math.random() > 0.5 ? "❤️" : "💕";

      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = (14 + Math.random() * 22) + "px";
      heart.style.animationDuration = (5 + Math.random() * 5) + "s";

      document.body.appendChild(heart);

      setTimeout(() => heart.remove(), 10000);
    }

    setInterval(createFloatingHeart, 600);
  </script>

</body>
</html>
