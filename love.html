<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Heart ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100vh;
            font-family: Arial, sans-serif;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>

    <canvas id="c"></canvas>

    <script>
        const canvas = document.getElementById("c");
        const ctx = canvas.getContext("2d");

        let width, height;
        let angle = 0;

        const TEXT = "I love you";
        const NUM_STEPS = 90;
        const PARTICLES = 100;

        // Adjust canvas size
        function resize() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);

            width = window.innerWidth;
            height = window.innerHeight;

            canvas.width = width * dpr;
            canvas.height = height * dpr;

            canvas.style.width = width + "px";
            canvas.style.height = height + "px";

            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        window.addEventListener("resize", resize);
        resize();

        // Heart shape coordinates
        function heartX(t) {
            return 16 * Math.pow(Math.sin(t), 3);
        }

        function heartY(t) {
            return (
                13 * Math.cos(t) -
                5 * Math.cos(2 * t) -
                2 * Math.cos(3 * t) -
                Math.cos(4 * t)
            );
        }

        // Create floating particles
        const particles = [];

        for (let i = 0; i < PARTICLES; i++) {
            particles.push({
                x: Math.random() * 2 - 1,
                y: Math.random() * 2 - 1,
                size: Math.random() * 2 + 0.5,
                speed: Math.random() * 0.7 + 0.2,
                alpha: Math.random() * 0.7 + 0.2
            });
        }

        // Draw floating particles
        function drawParticles() {
            for (const p of particles) {
                p.y -= p.speed * 0.003;

                if (p.y < -1) {
                    p.y = 1;
                    p.x = Math.random() * 2 - 1;
                }

                ctx.beginPath();

                ctx.arc(
                    width / 2 + p.x * width / 2,
                    height / 2 + p.y * height / 2,
                    p.size,
                    0,
                    Math.PI * 2
                );

                ctx.fillStyle = `rgba(255, 80, 120, ${p.alpha})`;
                ctx.fill();
            }
        }

        // Main animation
        function draw() {
            ctx.clearRect(0, 0, width, height);

            drawParticles();

            const cx = width / 2;
            const cy = height / 2;

            const scale = Math.min(width / 42, height / 35, 18);

            // Heart beating effect
            const pulse = 1 + Math.sin(angle) * 0.045;

            ctx.save();

            ctx.translate(cx, cy);
            ctx.scale(scale * pulse, -scale * pulse);

            // Draw glowing heart outline
            ctx.beginPath();

            for (let i = 0; i <= 400; i++) {
                const t = (i / 400) * Math.PI * 2;

                const x = heartX(t);
                const y = heartY(t);

                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }

            ctx.closePath();

            ctx.shadowColor = "#ff1744";
            ctx.shadowBlur = 25;
            ctx.strokeStyle = "#ff1744";
            ctx.lineWidth = 0.3;

            ctx.stroke();

            // Draw "I love you" text around the heart
            ctx.scale(1, -1);

            ctx.shadowColor = "#ff1744";
            ctx.shadowBlur = 12;

            ctx.fillStyle = "#ffccd5";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            // Correct font size
            ctx.font = `${Math.max(1.5, scale * 0.8)}px Arial`;

            for (let i = 0; i < NUM_STEPS; i++) {
                const t = (i / NUM_STEPS) * Math.PI * 2;

                const x = heartX(t);
                const y = heartY(t);

                ctx.fillText(TEXT, x, -y);
            }

            ctx.restore();

            angle += 0.045;

            requestAnimationFrame(draw);
        }

        // Start animation
        draw();
    </script>

</body>

</html>
