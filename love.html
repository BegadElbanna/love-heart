<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Kanoza ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    overflow: hidden;
    background: radial-gradient(circle, #250014, #050005 75%);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
}

.scene {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    height: 100%;
}

.heart-group {
    position: relative;
    width: 300px;
    height: 300px;
    display: flex;
    justify-content: center;
    align-items: center;
    animation: heartbeat 1.3s ease-in-out infinite;
}

.heart {
    position: absolute;
    width: 145px;
    height: 145px;
    background: #ff0757;
    transform: rotate(-45deg);
    box-shadow:
        0 0 20px #ff0757,
        0 0 45px #ff0757,
        0 0 85px #ff0757;
}

.heart::before,
.heart::after {
    content: "";
    position: absolute;
    width: 145px;
    height: 145px;
    background: #ff0757;
    border-radius: 50%;
}

.heart::before {
    top: -72px;
    left: 0;
}

.heart::after {
    left: 72px;
    top: 0;
}

.name {
    position: relative;
    z-index: 2;
    transform: translateY(-18px);
    color: white;
    font-size: clamp(30px, 9vw, 43px);
    font-weight: bold;
    white-space: nowrap;
    text-shadow:
        0 0 8px white,
        0 0 18px #ff0757,
        0 0 35px #ff0757;
    animation: nameGlow 1.3s ease-in-out infinite;
}

.message {
    position: absolute;
    top: calc(50% + 155px);
    left: 50%;
    transform: translateX(-50%);
    color: #ff9cbd;
    font-size: 18px;
    white-space: nowrap;
    letter-spacing: 3px;
    text-shadow: 0 0 15px #ff0757;
}

.love {
    position: fixed;
    bottom: -30px;
    color: #ff4d88;
    pointer-events: none;
    animation: floatUp linear forwards;
    text-shadow: 0 0 12px #ff0757;
}

@keyframes heartbeat {
    0%, 100% {
        transform: scale(0.88);
    }
    50% {
        transform: scale(1.05);
    }
}

@keyframes nameGlow {
    0%, 100% {
        text-shadow:
            0 0 8px white,
            0 0 18px #ff0757,
            0 0 35px #ff0757;
    }
    50% {
        text-shadow:
            0 0 12px white,
            0 0 28px #ff4d88,
            0 0 48px #ff0757;
    }
}

@keyframes floatUp {
    0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
    }
    15% {
        opacity: 1;
    }
    100% {
        transform: translateY(-110vh) rotate(35deg);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="scene">
    <div class="heart-group">
        <div class="heart"></div>
        <div class="name">Kanoza</div>
    </div>

    <div class="message">I LOVE YOU ❤️</div>
</div>

<script>
function createLove() {
    const item = document.createElement("div");

    item.className = "love";
    item.textContent = Math.random() > 0.5 ? "♥" : "❤";

    item.style.left = Math.random() * 100 + "vw";
    item.style.fontSize = (12 + Math.random() * 22) + "px";
    item.style.animationDuration = (4 + Math.random() * 4) + "s";

    document.body.appendChild(item);

    setTimeout(() => item.remove(), 8500);
}

setInterval(createLove, 350);
</script>

</body>
</html>
